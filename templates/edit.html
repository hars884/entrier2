<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
</head>
<body>
    <h1>Edit Employee</h1>
    <form method="POST" action="/edit/{{ employee.name }}">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ employee.name }}" required>
        <br>
        <label for="gmail">Email:</label>
        <input type="gmail" id="gmail" name="gmail" value="{{ employee.gmail }}" required>
        <br>
        <label for="department">Department:</label>
        <input type="text" id="department" name="department" value="{{ employee.department }}" required>
        <br>
        <label for="salary">Salary:</label>
        <input type="number" id="salary" name="salary" value="{{ employee.salary }}" required>
        <br>
        <button type="submit">Update</button>
    </form>
</body>
</html>
